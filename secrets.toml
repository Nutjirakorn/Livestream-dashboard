# ==========================================================================================
# SAVE THIS FILE AS:   .streamlit/secrets.toml
#   - ".streamlit" is a folder (starts with a dot) inside the folder where you run
#       streamlit run streamlit_app.py
#   - the file name is exactly "secrets.toml" (no .example, no .txt)
#   Your folder should look like:
#       my-dashboard/
#       ├── streamlit_app.py
#       ├── requirements.txt
#       └── .streamlit/
#           └── secrets.toml
#
# ON STREAMLIT COMMUNITY CLOUD: don't upload this file. Open the app > Settings > Secrets,
# paste the text below (from [gcp_service_account] down), Save, then reboot the app.
#
# Fill in the values from the service account JSON key you downloaded from Google Cloud.
# Use ONE of the two options below, not both.
# ==========================================================================================

# ---- Option A: copy each value from the JSON key file --------------------------------------
[gcp_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "abc123..."
# Keep the \n exactly as they appear in the JSON file, all on one line:
private_key = "-----BEGIN PRIVATE KEY-----\nMIIEv...\n...\n-----END PRIVATE KEY-----\n"
client_email = "live-dashboard@your-project-id.iam.gserviceaccount.com"
client_id = "1234567890"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/live-dashboard%40your-project-id.iam.gserviceaccount.com"

# ---- Option B (easier): delete everything from [gcp_service_account] above, then paste the
# whole JSON key file between the triple quotes:
#
# gcp_service_account = '''
# {
#   "type": "service_account",
#   "project_id": "...",
#   ...
# }
# '''
